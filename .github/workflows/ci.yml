# Every push to main runs what was run by hand before a push. Vercel promotes a production
# deployment only when both jobs pass (Deployment Checks, docs/deploy-checks.md): the job names
# are what Vercel selects, so renaming a job means selecting it again there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:data
      - run: npm run validate:es
      # Only what ships to phones and the functions; dev tools are updated by hand (docs/launch-audit-2026-11-05.md, O8).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build # tsc -b included
      - run: npm run check:build # everything precached: offline must not break silently

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # playwright.config.ts uses the installed Chrome (channel: 'chrome'), which ubuntu-24.04 has.
      - run: npm run test:e2e
