<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the phone keyboard shrinks the page instead of covering it,
         so the bar at the bottom of a lesson rides on top of the keyboard (see src/lib/keyboard.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SOMOS</title>
    <meta name="description" content="Mexická španielčina zo slovenčiny" />
    <meta name="theme-color" content="#F4F1EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400..700&family=Young+Serif&display=swap"
    />

    <!-- Resolve the theme (light / dark) and the style before first paint, to avoid a flash.
         Keep in sync with src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = 'system';
        var look = 'classic';
        try {
          pref = localStorage.getItem('somos-theme') || 'system';
          look = localStorage.getItem('somos-look') || 'classic';
        } catch (e) {}
        var page = { classic: ['#F4F1EC', '#161614'], talavera: ['#F2F5FB', '#0B1124'] };
        if (!page[look]) look = 'classic';
        var dark = pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.look = look;
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', page[look][dark ? 1 : 0]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
