<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SOMOS</title>
    <meta name="description" content="Mexická španielčina zo slovenčiny" />
    <meta name="theme-color" content="#F4F1EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400..700&display=swap"
    />

    <!-- Resolve theme before first paint to avoid a light/dark flash.
         Keep in sync with src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('somos-theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#161614' : '#F4F1EC');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
