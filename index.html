<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the phone keyboard shrinks the page instead of covering it,
         so the bar at the bottom of a lesson rides on top of the keyboard (see src/lib/keyboard.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SOMOS</title>
    <meta name="description" content="Mexická španielčina zo slovenčiny" />
    <meta name="theme-color" content="#F4F1EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400..700&family=Alegreya+Sans:wght@400;500;700&family=Bricolage+Grotesque:wght@400..700&family=Figtree:wght@400..700&family=Fraunces:opsz,wght@9..144,300..700&family=Instrument+Sans:wght@400..700&family=Inter:wght@400..700&family=Young+Serif&display=swap"
    />

    <!-- Theme before first paint (public/theme-init.js): blocking on purpose, keep it a classic script. -->
    <script src="/theme-init.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
